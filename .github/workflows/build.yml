name: 🚀 Build Android GDExtension (Godot Dev)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64]
        target: [template_debug, template_release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download godot-cpp (Master / Dev)
        run: |
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up Android NDK (r28b)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Link NDK to Expected Godot Path
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo ln -sfn "${{ steps.setup-ndk.outputs.ndk-path }}" /usr/local/lib/android/sdk/ndk/28.1.13356709

      - name: Build GDExtension for Android
        run: |
          scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} -j$(nproc)

      - name: Upload Android Libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}-${{ matrix.target }}
          path: godot_project/bin/*.so
