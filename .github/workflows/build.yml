name: 🚀 Build Android GDExtension (Godot Dev / NDK r27)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64]
        target: [template_debug, template_release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download godot-cpp (Latest Master / Dev)
        run: |
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up Android NDK (r27c)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build GDExtension for Android (NDK r27)
        run: |
          scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}" -j$(nproc)

      - name: Upload Android Libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}-${{ matrix.target }}
          path: godot_project/bin/*.so
