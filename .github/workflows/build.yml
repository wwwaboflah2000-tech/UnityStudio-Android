name: 🚀 Build Android GDExtension

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64]
        target: [template_debug, template_release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons

      # ⚡ محرك التخزين السريع ccache (المعتمد رسمياً في Godot) ⚡
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.target }}-ccache
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.target }}-ccache
          max-size: 2G

      - name: Install Android NDK 28
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Clone godot-cpp
        run: |
          if [ ! -d "godot-cpp" ]; then
            git clone --recursive -b master https://github.com/godotengine/godot-cpp.git godot-cpp
          fi

      - name: Build GDExtension for Android (with ccache)
        run: |
          mkdir -p godot_project/bin
          scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} api_version=4.7 ANDROID_HOME=$ANDROID_HOME use_ccache=yes -j$(nproc)

      - name: Upload Android Libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}-${{ matrix.target }}
          path: godot_project/bin/*.so
